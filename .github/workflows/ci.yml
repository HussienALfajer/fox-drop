name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      # openapi-generator, which generates the Dart client, runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - run: pnpm install --frozen-lockfile

      # The generator jar, version pinned in openapitools.json, downloads once.
      - uses: actions/cache@v5
        with:
          path: node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-${{ hashFiles('openapitools.json') }}

      - run: dart pub get --enforce-lockfile

      # The web apps' smoke tests run in Chromium (architecture §18.2).
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium's system libraries, once; pnpm verify installs the browser for each app.
      - run: pnpm --filter @fox-drop/admin exec playwright install-deps chromium

      - run: pnpm verify

      # The traces of a failed smoke test (playwright.config.ts).
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/*/test-results/
          if-no-files-found: ignore

  # Architecture §4.4: one image runs the four server roles.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file apps/server/Dockerfile --tag fox-drop-server:ci .

      - run: node apps/server/scripts/smoke-image.mjs fox-drop-server:ci

  # The panel and the portal in one image (infra/web), checked as it runs on the server.
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file infra/web/Dockerfile --tag fox-drop-web:ci .

      - run: node infra/web/smoke-image.mjs fox-drop-web:ci

  # Architecture §17.3: every merge to main builds the images, pushes them to
  # the GitHub container registry and deploys staging over SSH. The key can
  # only run infra/server/deploy-ssh.sh on the server (the deploy skill); it
  # is a secret of the staging environment, which only main may use.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, server-image, web-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://foxdrop-staging-admin.109-199-111-169.sslip.io
    # One deploy at a time; a newer merge waits instead of cancelling one midway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub container registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        run: |
          registry=ghcr.io/hussienalfajer
          docker build --file apps/server/Dockerfile --build-arg "FOX_DROP_RELEASE=$GITHUB_SHA" \
            --tag "$registry/fox-drop-server:$GITHUB_SHA" .
          docker build --file infra/web/Dockerfile --tag "$registry/fox-drop-web:$GITHUB_SHA" .
          docker push --quiet "$registry/fox-drop-server:$GITHUB_SHA"
          docker push --quiet "$registry/fox-drop-web:$GITHUB_SHA"

      - name: Deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "foxdrop-deploy@$SSH_HOST" "staging $GITHUB_SHA"
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}

  # Slice 1.14b (owner decisions 2026-11-07): every merge to main builds the
  # three apps' staging APKs (Android only), signed with each app's staging
  # key, as artifacts of the run (the deploy skill). The keys are secrets of
  # the staging environment, which only main may use.
  # The release build of each Android app on every pull request, so a plugin
  # that breaks it (a compileSdk, an AAR metadata check, R8) fails before the
  # merge and not in staging-apks. No secret: signed with the debug key and
  # never kept (the deploy skill, «The staging APKs»).
  android-release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [customer, merchant, captain]
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches the Gradle distribution and dependencies, so a build does not
      # download them from GitHub and Maven each run (a 504 on the wrapper's
      # download failed PR 89). Main writes the cache (staging-apks), pull
      # requests read it. 'basic' is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: dart pub get --enforce-lockfile

      - name: Build the staging release APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --flavor staging --release

  staging-apks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            key: CUSTOMER
          - app: merchant
            key: MERCHANT
          - app: captain
            key: CAPTAIN
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches the Gradle distribution and dependencies, so a build does not
      # download them from GitHub and Maven each run (a 504 on the wrapper's
      # download failed PR 89). Main writes the cache (staging-apks), pull
      # requests read it. 'basic' is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: dart pub get --enforce-lockfile

      # The API address and the Firebase project come from the environment's
      # public settings; the app's Firebase ID is a variable and the Firebase
      # API key a secret of the staging environment (owner decision
      # 2026-11-07: no google-services.json in the repository). Until the
      # owner sets them, the APK is built without App Check (the deploy skill).
      - name: Build the signed staging APK
        working-directory: apps/${{ matrix.app }}
        run: |
          setting() { grep -E "^$1=" ../../infra/environments/staging.env | cut -d= -f2; }
          api_host=$(setting API_HOST)
          firebase=()
          if [ -n "$FIREBASE_APP_ID" ]; then
            project_id=$(setting FIREBASE_PROJECT_ID)
            project_number=$(setting FIREBASE_PROJECT_NUMBER)
            if [ -z "$project_id" ] || [ -z "$project_number" ] || [ -z "$FIREBASE_API_KEY" ]; then
              echo "::error::FIREBASE_APP_ID is set but the Firebase project or API key is missing"
              exit 1
            fi
            firebase=(
              --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID"
              --dart-define="FIREBASE_PROJECT_ID=$project_id"
              --dart-define="FIREBASE_PROJECT_NUMBER=$project_number"
              --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
            )
          else
            echo "::warning::No Firebase app ID for ${{ matrix.app }}: this APK sends no App Check token"
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export FOXDROP_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          flutter build apk --flavor staging --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=https://$api_host" \
            --dart-define="UPDATE_URL=$UPDATE_URL" \
            "${firebase[@]}"
          rm "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE: ${{ secrets[format('STAGING_{0}_KEYSTORE', matrix.key)] }}
          FOXDROP_KEYSTORE_PASSWORD: ${{ secrets[format('STAGING_{0}_KEYSTORE_PASSWORD', matrix.key)] }}
          FOXDROP_KEY_ALIAS: foxdrop
          FIREBASE_APP_ID: ${{ vars[format('STAGING_FIREBASE_{0}_APP_ID', matrix.key)] }}
          FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          # Where the update screen's button leads (RA §4.2); empty hides it.
          UPDATE_URL: ${{ vars[format('STAGING_{0}_UPDATE_URL', matrix.key)] }}

      - uses: actions/upload-artifact@v5
        with:
          name: foxdrop-${{ matrix.app }}-staging-${{ github.run_number }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-staging-release.apk
          if-no-files-found: error
          retention-days: 30
