name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change touches. Markdown and docs/ only: Prettier alone checks
  # them. The specs (docs/product, docs/domain) count as code, since tests
  # check the code against them (catalogue.test.ts reads AP Appendix A). The
  # Dart checks and tests run only for a change to Dart code, a pubspec, the
  # analysis or localization files, the pinned Flutter, this workflow or
  # verify.mjs (a server route changes packages/core_api, the committed
  # client, and the contract job fails one left stale). The Android builds
  # run only for a change to a Flutter app, a Dart package or this workflow.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      dart: ${{ steps.paths.outputs.dart }}
      flutter: ${{ steps.paths.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # No commit to compare with (a new branch): check everything.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "dart=true" >> "$GITHUB_OUTPUT"
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without renames, a file moved into docs/ counts at its old path too.
          files=$(git diff --name-only --no-renames "$BASE" HEAD)
          printf '%s\n' "$files"
          code=false
          dart=false
          flutter=false
          # Here-strings, not pipes: under pipefail an early grep -q exit
          # could fail the pipe on a long list.
          if grep -qvE '(\.md$|^docs/)' <<<"$files"; then code=true; fi
          if grep -qE '^docs/(product|domain)/' <<<"$files"; then code=true; fi
          # Markdown alone, even in a Dart folder, is code=false: no Dart then.
          if [ "$code" = true ]; then
            if grep -qE '(\.dart$|\.arb$|(^|/)(pubspec\.(yaml|lock)|analysis_options\.yaml|l10n\.yaml)$|^(apps/(customer|captain|merchant)|packages/core_[a-z0-9_]+)/|^\.fvmrc$|^\.github/workflows/ci\.yml$|^scripts/verify\.mjs$)' <<<"$files"; then dart=true; fi
            if grep -qE '^(apps/(customer|captain|merchant)/|packages/core_|pubspec\.(yaml|lock)$|\.fvmrc$|analysis_options\.yaml$|\.github/workflows/ci\.yml$)' <<<"$files"; then flutter=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "dart=$dart" >> "$GITHUB_OUTPUT"
          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"

  # The parts of pnpm verify run as parallel jobs (scripts/verify.mjs). The
  # `verify` job below is the one check main requires.
  contract:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      # openapi-generator, which generates the Dart client, runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # The generator jar, version pinned in openapitools.json, downloads once.
      - uses: actions/cache@v5
        with:
          path: node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-${{ hashFiles('openapitools.json') }}

      - run: dart pub get --enforce-lockfile

      - run: node scripts/verify.mjs contract

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/verify.mjs format

  typescript:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web apps' smoke tests run in Chromium (architecture §18.2).
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium's system libraries, once; verify installs the browser for each app.
      - run: pnpm --filter @fox-drop/admin exec playwright install-deps chromium

      - run: node scripts/verify.mjs typescript

      # The traces of a failed smoke test (playwright.config.ts).
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/*/test-results/
          if-no-files-found: ignore

  # The server's tests start PostGIS and Valkey with Testcontainers, in three
  # shards (Vitest's split of the files).
  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/verify.mjs server --shard=${{ matrix.shard }}/3

  dart:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Runs scripts/verify.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      - run: node scripts/verify.mjs dart

  # The Flutter packages' tests in three shards, balanced by verify.mjs
  # (FLUTTER_TEST_SECONDS); every package lands in one shard.
  flutter:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      # Runs scripts/verify.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      - run: node scripts/verify.mjs flutter --shard=${{ matrix.shard }}/3

  # The check main requires: every part passed, or was skipped for a change
  # of docs only, or of no Dart.
  verify:
    if: always()
    needs: [changes, contract, format, typescript, server, dart, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  # Architecture §4.4: one image runs the four server roles.
  server-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file apps/server/Dockerfile --tag fox-drop-server:ci .

      - run: node apps/server/scripts/smoke-image.mjs fox-drop-server:ci

  # The panel and the portal in one image (infra/web), checked as it runs on the server.
  web-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file infra/web/Dockerfile --tag fox-drop-web:ci .

      - run: node infra/web/smoke-image.mjs fox-drop-web:ci

  # Architecture §17.3: every merge to main (but one of docs only) builds the
  # images, pushes them to the GitHub container registry and deploys staging
  # over SSH. The key can
  # only run infra/server/deploy-ssh.sh on the server (the deploy skill); it
  # is a secret of the staging environment, which only main may use.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, server-image, web-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://foxdrop-staging-admin.109-199-111-169.sslip.io
    # One deploy at a time; a newer merge waits instead of cancelling one midway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub container registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        run: |
          registry=ghcr.io/hussienalfajer
          docker build --file apps/server/Dockerfile --build-arg "FOX_DROP_RELEASE=$GITHUB_SHA" \
            --tag "$registry/fox-drop-server:$GITHUB_SHA" .
          docker build --file infra/web/Dockerfile --tag "$registry/fox-drop-web:$GITHUB_SHA" .
          docker push --quiet "$registry/fox-drop-server:$GITHUB_SHA"
          docker push --quiet "$registry/fox-drop-web:$GITHUB_SHA"

      - name: Deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "foxdrop-deploy@$SSH_HOST" "staging $GITHUB_SHA"
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}

  # Slice 1.14b (owner decisions 2026-11-07): every merge to main (but one of
  # docs only) builds the three apps' staging APKs (Android only), signed with each app's staging
  # key, as artifacts of the run (the deploy skill). The keys are secrets of
  # the staging environment, which only main may use.
  # The release build of each Android app on every pull request that touches
  # a Flutter app, a Dart package or this workflow (the changes job), so a
  # plugin that breaks it (a compileSdk, an AAR metadata check, R8) fails
  # before the merge and not in staging-apks. No secret: signed with the debug key and
  # never kept (the deploy skill, «The staging APKs»).
  android-release:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [customer, merchant, captain]
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution and dependencies, so a build does not
      # download them from GitHub and Maven each run (a 504 on the wrapper's
      # download failed PR 89). Main writes the cache (staging-apks), pull
      # requests read it. 'basic' is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: dart pub get --enforce-lockfile

      - name: Build the staging release APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --flavor staging --release

  staging-apks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            key: CUSTOMER
          - app: merchant
            key: MERCHANT
          - app: captain
            key: CAPTAIN
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution and dependencies, so a build does not
      # download them from GitHub and Maven each run (a 504 on the wrapper's
      # download failed PR 89). Main writes the cache (staging-apks), pull
      # requests read it. 'basic' is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: dart pub get --enforce-lockfile

      # The API address and the Firebase project come from the environment's
      # public settings; the app's Firebase ID is a variable and the Firebase
      # API key a secret of the staging environment (owner decision
      # 2026-11-07: no google-services.json in the repository). Until the
      # owner sets them, the APK is built without App Check (the deploy skill).
      - name: Build the signed staging APK
        working-directory: apps/${{ matrix.app }}
        run: |
          setting() { grep -E "^$1=" ../../infra/environments/staging.env | cut -d= -f2; }
          api_host=$(setting API_HOST)
          defines=()
          if [ -n "$FIREBASE_APP_ID" ]; then
            project_id=$(setting FIREBASE_PROJECT_ID)
            project_number=$(setting FIREBASE_PROJECT_NUMBER)
            if [ -z "$project_id" ] || [ -z "$project_number" ] || [ -z "$FIREBASE_API_KEY" ]; then
              echo "::error::FIREBASE_APP_ID is set but the Firebase project or API key is missing"
              exit 1
            fi
            defines=(
              --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID"
              --dart-define="FIREBASE_PROJECT_ID=$project_id"
              --dart-define="FIREBASE_PROJECT_NUMBER=$project_number"
              --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
            )
          else
            echo "::warning::No Firebase app ID for ${{ matrix.app }}: this APK sends no App Check token"
          fi
          # Slice 2.43: with its licence the captain APK tracks through the
          # background location library, else through geolocator.
          if [ -n "$FOXDROP_BGGEO_LICENSE" ]; then
            defines+=(--dart-define=BACKGROUND_LOCATION_LICENSED=true)
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export FOXDROP_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          flutter build apk --flavor staging --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=https://$api_host" \
            --dart-define="UPDATE_URL=$UPDATE_URL" \
            "${defines[@]}"
          rm "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE: ${{ secrets[format('STAGING_{0}_KEYSTORE', matrix.key)] }}
          FOXDROP_KEYSTORE_PASSWORD: ${{ secrets[format('STAGING_{0}_KEYSTORE_PASSWORD', matrix.key)] }}
          FOXDROP_KEY_ALIAS: foxdrop
          FIREBASE_APP_ID: ${{ vars[format('STAGING_FIREBASE_{0}_APP_ID', matrix.key)] }}
          FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          # Where the update screen's button leads (RA §4.2); empty hides it.
          UPDATE_URL: ${{ vars[format('STAGING_{0}_UPDATE_URL', matrix.key)] }}
          # The captain app's background location licence (slice 2.43,
          # architecture §22 item 8), generated for the staging app ID;
          # empty until the owner buys it, and none for the other apps.
          FOXDROP_BGGEO_LICENSE: ${{ secrets[format('STAGING_{0}_BGGEO_LICENSE', matrix.key)] }}

      - uses: actions/upload-artifact@v5
        with:
          name: foxdrop-${{ matrix.app }}-staging-${{ github.run_number }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-staging-release.apk
          if-no-files-found: error
          retention-days: 30
