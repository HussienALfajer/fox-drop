name: CI

on:
  pull_request:
    # `labeled`: the native-builds label runs the native release builds.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# Each push to main in its own group: GitHub cancels a pending run when a
# newer one joins its group, and main's full run is the net for what a pull
# request's narrower run skips, so no merge may lose it.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change touches (scripts/classify-changes.mjs). Markdown and docs/
  # only: Prettier alone checks them, but for the spec files a test reads
  # (SPEC_FILES_READ_BY_TESTS), which set the checks (`code`) and still build
  # and deploy nothing (`build`). The Dart checks and tests run only for a
  # change to Dart code, a pubspec, the analysis or localization files, the
  # pinned Flutter, this workflow or the check engine (verify.mjs and the
  # scripts it runs; a server route changes
  # packages/core_api, the committed client, and the contract job fails one
  # left stale). The native release builds of a pull request run only for a
  # native project, the lock file, a package with native code or the pinned
  # Flutter (`native`), or with the native-builds label, which a change to
  # the native jobs below takes. Main builds Android only (staging-apks).
  # On a pull request the TypeScript jobs (`lint`,
  # `e2e`), the server's tests and the contract run only for a change they can
  # break (`typescript`, `server`, `contract`: ciJobs in the classifier), and
  # Turborepo checks only the packages the change affects (`--affected`); on
  # main, and for a change to the check engine, every one runs as for any
  # code change, every package forced. A pull request of more than 25
  # hand-written files gets a warning, never a failure.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      dart: ${{ steps.paths.outputs.dart }}
      native: ${{ steps.paths.outputs.native }}
      build: ${{ steps.paths.outputs.build }}
      typescript: ${{ steps.paths.outputs.typescript }}
      server: ${{ steps.paths.outputs.server }}
      contract: ${{ steps.paths.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # A pull request's own last commit, not the merge commit CI checks
          # out, whose patch is empty without -m.
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # The classifier that `node scripts/verify.mjs --changed` uses too;
        # with no base commit (a new branch) everything counts as changed.
        run: node scripts/classify-changes.mjs "$BASE" ${{ github.event_name == 'push' && '--push' || '' }} >> "$GITHUB_OUTPUT"

      # The slice size rule (docs/process/development-workflow.md): a notice,
      # not a gate. Generated files, lock files, images and snapshots do not
      # count (NOT_HAND_WRITTEN in the classifier).
      - name: Pull request size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          HAND_WRITTEN: ${{ steps.paths.outputs.hand_written }}
        run: |
          echo "Hand-written files changed: ${HAND_WRITTEN:-unknown}"
          if [ "${HAND_WRITTEN:-0}" -gt 25 ]; then
            echo "::warning title=Large pull request::$HAND_WRITTEN hand-written files changed, more than 25. Split the work into smaller slices: see the slice size rule in docs/process/development-workflow.md."
          fi

  # The parts of pnpm verify run as parallel jobs (scripts/verify.mjs). The
  # `verify` job below is the one check main requires.
  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      # openapi-generator, which generates the Dart client, runs on Java.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      - run: pnpm install --frozen-lockfile

      # The generator jar, version pinned in openapitools.json, downloads once.
      - uses: actions/cache@v5
        with:
          path: node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-${{ hashFiles('openapitools.json') }}

      - run: dart pub get --enforce-lockfile

      - run: node scripts/verify.mjs contract

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: the secret scan reads every commit of the change.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The public repository's secret scan (.gitleaks.toml): every commit the
      # change adds, before anything is installed. gitleaks is pinned by
      # version and checksum (Renovate does not see this pin: bump both
      # together from the release's checksums file).
      - name: Scan the change for secrets
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # A pull request's own last commit, not the merge commit CI checks
          # out, whose patch is empty without -m.
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          version=8.30.1
          sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          echo "$sum  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # No usable base (a first push, or a base missing from the history):
          # scan the last commit.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          # gitleaks reads this file by itself; findings are allowed only in
          # .gitleaks.toml, which REVIEW item 12 shows the owner.
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore is not allowed: allow a finding in .gitleaks.toml"
            exit 1
          fi
          # first-parent: a merge commit's own changes (a conflict resolved
          # while merging main) are scanned too.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent $range" \
            --redact --verbose --no-banner --exit-code 1 .

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/verify.mjs format

  # The TypeScript part (`verify.mjs typescript`) in parallel jobs: `lint`
  # (the root lint, lint, type check and the unit tests other than the
  # server's) and `e2e`, one job per package with a build or smoke tests;
  # `lint` plus every `e2e` package is `typescript`.
  lint:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history: Turborepo compares the pull request with its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/verify.mjs lint ${{ github.event_name == 'pull_request' && format('--affected={0}', github.event.pull_request.base.sha) || '' }}

  # Each package's build and smoke tests. classify-changes.test.mjs fails when
  # a workspace package with a build or test:e2e script is missing here.
  e2e:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The server has a build and no smoke tests.
        package: [admin, merchant-portal, server]
    steps:
      # The whole history: Turborepo compares the pull request with its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web apps' smoke tests run in Chromium (architecture §18.2); verify
      # installs the browser in every e2e job.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium's system libraries, where a smoke test runs it.
      - if: matrix.package != 'server'
        run: pnpm --filter @fox-drop/admin exec playwright install-deps chromium

      - run: node scripts/verify.mjs e2e --package=@fox-drop/${{ matrix.package }} ${{ github.event_name == 'pull_request' && format('--affected={0}', github.event.pull_request.base.sha) || '' }}

      # The traces of a failed smoke test (playwright.config.ts).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results-${{ matrix.package }}
          path: apps/*/test-results/
          if-no-files-found: ignore

  # The server's tests start PostGIS and Valkey with Testcontainers, in four
  # shards balanced by the files' measured times (apps/server/test/timed-shards.ts).
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/verify.mjs server --shard=${{ matrix.shard }}/4

  dart:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Runs scripts/verify.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      - run: node scripts/verify.mjs dart

  # The Flutter packages' tests in three shards, balanced by verify.mjs
  # (FLUTTER_TEST_SECONDS); every package lands in one shard.
  flutter:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      # Runs scripts/verify.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      - run: node scripts/verify.mjs flutter --shard=${{ matrix.shard }}/3

  # The check main requires: every part passed, or was skipped for a change
  # of docs only, of no Dart or of nothing native, or, on a pull request, of no TypeScript, nothing the
  # server's tests read or nothing the contract is built from (ciJobs). The
  # two images count too, so a broken Dockerfile cannot merge. A part skipped
  # because `changes` failed still fails here, through `changes`' own result.
  verify:
    if: always()
    needs:
      [
        changes,
        contract,
        format,
        lint,
        e2e,
        server,
        dart,
        flutter,
        server-image,
        web-image,
        android-release,
        windows-release,
        ios-release,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  # Architecture §4.4: one image runs the four server roles.
  server-image:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file apps/server/Dockerfile --tag fox-drop-server:ci .

      - run: node apps/server/scripts/smoke-image.mjs fox-drop-server:ci

  # The panel and the portal in one image (infra/web), checked as it runs on the server.
  web-image:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file infra/web/Dockerfile --tag fox-drop-web:ci .

      - run: node infra/web/smoke-image.mjs fox-drop-web:ci

  # Architecture §17.3: every merge to main (but one of docs or specs only)
  # builds the images, pushes them to the GitHub container registry and
  # deploys staging over SSH. The key can
  # only run infra/server/deploy-ssh.sh on the server (the deploy skill); it
  # is a secret of the staging environment, which only main may use.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    needs: [changes, verify, server-image, web-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://foxdrop-staging-admin.109-199-111-169.sslip.io
    # One deploy at a time; a newer merge waits instead of cancelling one midway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub container registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        run: |
          registry=ghcr.io/hussienalfajer
          docker build --file apps/server/Dockerfile --build-arg "FOX_DROP_RELEASE=$GITHUB_SHA" \
            --tag "$registry/fox-drop-server:$GITHUB_SHA" .
          docker build --file infra/web/Dockerfile --tag "$registry/fox-drop-web:$GITHUB_SHA" .
          docker push --quiet "$registry/fox-drop-server:$GITHUB_SHA"
          docker push --quiet "$registry/fox-drop-web:$GITHUB_SHA"

      - name: Deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "foxdrop-deploy@$SSH_HOST" "staging $GITHUB_SHA"
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}

  # The release build of each Android app on every pull request that touches
  # something native (the changes job) or has the native-builds label, so a
  # plugin that breaks it (a compileSdk, an AAR metadata check, R8) fails
  # before the merge and not in staging-apks. No secret: signed with the debug key and
  # never kept (the deploy skill, «The staging APKs»).
  android-release:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.native == 'true' || contains(github.event.pull_request.labels.*.name, 'native-builds'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [customer, merchant, captain]
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      # Caches the Gradle distribution and dependencies, so a build does not
      # download them from GitHub and Maven each run (a 504 on the wrapper's
      # download failed PR 89). Main writes the cache (staging-apks), pull
      # requests read it. 'basic' is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: dart pub get --enforce-lockfile

      - name: Build the staging release APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --flavor staging --release

  # Slice 2.44: the restaurant app's Windows release build on every pull
  # request that touches something native or has the native-builds label, so
  # the Win32 plugins (core_alerts' own included, which has no unit tests)
  # compile before the merge. No secret, never kept.
  windows-release:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.native == 'true' || contains(github.event.pull_request.labels.*.name, 'native-builds'))
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        shell: bash
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      - name: Build the Windows release
        working-directory: apps/merchant
        run: flutter build windows --release

  # Slice 2.46 (owner decisions 2026-11-20): the customer and captain apps'
  # iOS release builds on every pull request that touches something native or
  # has the native-builds label, unsigned (no Apple account is needed), so
  # the Xcode projects, the Swift plugins (core_alerts' own included, which
  # has no unit tests) and the Swift packages compile before the merge.
  ios-release:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.native == 'true' || contains(github.event.pull_request.labels.*.name, 'native-builds'))
    # Xcode 26: firebase-ios-sdk 13 needs Swift tools 6.2.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [customer, captain]
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      # CocoaPods' downloads and the Swift packages Xcode resolves, so a build
      # does not fetch them each run. Shared with staging-ios, which writes
      # the cache on main; a pull request reads it.
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/repositories
          key: ios-dependencies-${{ matrix.app }}-${{ hashFiles('pubspec.lock', format('apps/{0}/ios/Podfile', matrix.app), format('apps/{0}/ios/Runner.xcodeproj/project.pbxproj', matrix.app)) }}
          restore-keys: ios-dependencies-${{ matrix.app }}-

      - name: Build the staging release, unsigned
        working-directory: apps/${{ matrix.app }}
        run: flutter build ios --flavor staging --release --no-codesign

  # Slice 2.46 (owner decisions 2026-11-20): every merge to main (but one of
  # docs only) builds the customer and captain apps' staging flavor for iOS,
  # signs it with automatic signing through an App Store Connect API key and
  # uploads it to TestFlight (the deploy skill, «The staging iOS builds»).
  # Skipped until the owner's Apple Developer account exists and the
  # repository variable STAGING_IOS_TEAM_ID is set (a job's `if` reads no
  # environment variable), with the key's secrets in the environment.
  staging-ios:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true' && vars.STAGING_IOS_TEAM_ID != ''
    needs: [changes, verify]
    runs-on: macos-26
    timeout-minutes: 60
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            key: CUSTOMER
          - app: captain
            key: CAPTAIN
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: dart pub get --enforce-lockfile

      # The same cache as ios-release's.
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/repositories
          key: ios-dependencies-${{ matrix.app }}-${{ hashFiles('pubspec.lock', format('apps/{0}/ios/Podfile', matrix.app), format('apps/{0}/ios/Runner.xcodeproj/project.pbxproj', matrix.app)) }}
          restore-keys: ios-dependencies-${{ matrix.app }}-

      # The values as staging-apks passes them, with the iOS app's Firebase
      # ID and the iOS API key Firebase made (the deploy skill, «App Check»).
      - name: Build, sign and upload to TestFlight
        working-directory: apps/${{ matrix.app }}
        run: |
          setting() { grep -E "^$1=" ../../infra/environments/staging.env | cut -d= -f2; }
          api_host=$(setting API_HOST)
          defines=(--dart-define="API_BASE_URL=https://$api_host" --dart-define="UPDATE_URL=$UPDATE_URL")
          if [ -n "$FIREBASE_APP_ID" ]; then
            project_id=$(setting FIREBASE_PROJECT_ID)
            project_number=$(setting FIREBASE_PROJECT_NUMBER)
            if [ -z "$project_id" ] || [ -z "$project_number" ] || [ -z "$FIREBASE_API_KEY" ]; then
              echo "::error::FIREBASE_APP_ID is set but the Firebase project or the iOS API key is missing"
              exit 1
            fi
            defines+=(
              --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID"
              --dart-define="FIREBASE_PROJECT_ID=$project_id"
              --dart-define="FIREBASE_PROJECT_NUMBER=$project_number"
              --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
            )
          else
            echo "::warning::No iOS Firebase app ID for ${{ matrix.app }}: no push and no App Check token"
          fi
          # The captain app's background location licence goes into
          # Info.plist (TSLocationManagerLicense) as a build setting.
          if [ -n "$FOXDROP_BGGEO_LICENSE" ]; then
            defines+=(--dart-define=BACKGROUND_LOCATION_LICENSED=true)
          fi
          key="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$ASC_KEY" | base64 --decode > "$key"
          auth=(-allowProvisioningUpdates
            -authenticationKeyPath "$key"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          flutter build ios --flavor staging --release --config-only \
            --build-number "$GITHUB_RUN_NUMBER" "${defines[@]}"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme staging \
            -configuration Release-staging -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            FOXDROP_BGGEO_LICENSE="$FOXDROP_BGGEO_LICENSE" \
            "${auth[@]}" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm "$key"
        env:
          TEAM_ID: ${{ vars.STAGING_IOS_TEAM_ID }}
          ASC_KEY: ${{ secrets.STAGING_IOS_ASC_KEY }}
          ASC_KEY_ID: ${{ vars.STAGING_IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.STAGING_IOS_ASC_ISSUER_ID }}
          FIREBASE_APP_ID: ${{ vars[format('STAGING_FIREBASE_{0}_IOS_APP_ID', matrix.key)] }}
          FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_IOS_API_KEY }}
          UPDATE_URL: ${{ vars[format('STAGING_{0}_IOS_UPDATE_URL', matrix.key)] }}
          FOXDROP_BGGEO_LICENSE: ${{ secrets[format('STAGING_{0}_BGGEO_LICENSE', matrix.key)] }}

  # Slice 1.14b (owner decisions 2026-11-07): every merge to main (but one of
  # docs only) builds the three apps' staging APKs (Android only), signed with
  # each app's staging key, as artifacts of the run (the deploy skill). The
  # keys are secrets of the staging environment, which only main may use.
  staging-apks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            key: CUSTOMER
          - app: merchant
            key: MERCHANT
          - app: captain
            key: CAPTAIN
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      # Caches the Gradle distribution and dependencies, so a build does not
      # download them from GitHub and Maven each run (a 504 on the wrapper's
      # download failed PR 89). Main writes the cache (staging-apks), pull
      # requests read it. 'basic' is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: dart pub get --enforce-lockfile

      # The API address and the Firebase project come from the environment's
      # public settings; the app's Firebase ID is a variable and the Firebase
      # API key a secret of the staging environment (owner decision
      # 2026-11-07: no google-services.json in the repository). Until the
      # owner sets them, the APK is built without App Check (the deploy skill).
      - name: Build the signed staging APK
        working-directory: apps/${{ matrix.app }}
        run: |
          setting() { grep -E "^$1=" ../../infra/environments/staging.env | cut -d= -f2; }
          api_host=$(setting API_HOST)
          defines=()
          if [ -n "$FIREBASE_APP_ID" ]; then
            project_id=$(setting FIREBASE_PROJECT_ID)
            project_number=$(setting FIREBASE_PROJECT_NUMBER)
            if [ -z "$project_id" ] || [ -z "$project_number" ] || [ -z "$FIREBASE_API_KEY" ]; then
              echo "::error::FIREBASE_APP_ID is set but the Firebase project or API key is missing"
              exit 1
            fi
            defines=(
              --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID"
              --dart-define="FIREBASE_PROJECT_ID=$project_id"
              --dart-define="FIREBASE_PROJECT_NUMBER=$project_number"
              --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
            )
          else
            echo "::warning::No Firebase app ID for ${{ matrix.app }}: this APK sends no App Check token"
          fi
          # Slice 2.43: with its licence the captain APK tracks through the
          # background location library, else through geolocator.
          if [ -n "$FOXDROP_BGGEO_LICENSE" ]; then
            defines+=(--dart-define=BACKGROUND_LOCATION_LICENSED=true)
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export FOXDROP_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          flutter build apk --flavor staging --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=https://$api_host" \
            --dart-define="UPDATE_URL=$UPDATE_URL" \
            "${defines[@]}"
          rm "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE: ${{ secrets[format('STAGING_{0}_KEYSTORE', matrix.key)] }}
          FOXDROP_KEYSTORE_PASSWORD: ${{ secrets[format('STAGING_{0}_KEYSTORE_PASSWORD', matrix.key)] }}
          FOXDROP_KEY_ALIAS: foxdrop
          FIREBASE_APP_ID: ${{ vars[format('STAGING_FIREBASE_{0}_APP_ID', matrix.key)] }}
          FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          # Where the update screen's button leads (RA §4.2); empty hides it.
          UPDATE_URL: ${{ vars[format('STAGING_{0}_UPDATE_URL', matrix.key)] }}
          # The captain app's background location licence (slice 2.43,
          # architecture §22 item 8), generated for the staging app ID;
          # empty until the owner buys it, and none for the other apps.
          FOXDROP_BGGEO_LICENSE: ${{ secrets[format('STAGING_{0}_BGGEO_LICENSE', matrix.key)] }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foxdrop-${{ matrix.app }}-staging-${{ github.run_number }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-staging-release.apk
          if-no-files-found: error
          retention-days: 30

  # Slice 2.44 (owner decisions 2026-11-20): every merge to main (but one of
  # docs only) builds the restaurant app for Windows, packs it with Velopack
  # (vpk) as its staging installer and full update package, and publishes
  # them to /downloads/windows/ on the staging API's host through the deploy
  # key (infra/server/windows-publish.sh). Unsigned until the owner sets up
  # Azure Trusted Signing (architecture §12.3, §22 item 8): SmartScreen warns.
  staging-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    needs: [changes, verify]
    runs-on: windows-latest
    timeout-minutes: 40
    environment: staging
    # One build at a time, in the order of the merges, so an older build
    # never publishes after a newer one.
    concurrency:
      group: staging-windows
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Flutter version
        id: flutter
        shell: bash
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - run: dart pub get --enforce-lockfile

      # The version Velopack orders: the app's, a staging pre-release per run.
      - name: Build and pack the staging installer
        shell: bash
        run: |
          setting() { grep -E "^$1=" infra/environments/staging.env | cut -d= -f2 | tr -d '\r'; }
          api_host=$(setting API_HOST)
          base=$(grep -E '^version:' apps/merchant/pubspec.yaml | sed -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          version="$base-staging.$GITHUB_RUN_NUMBER"
          feed="https://$api_host/downloads/windows/"
          cd apps/merchant
          flutter build windows --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=https://$api_host" \
            --dart-define="WINDOWS_UPDATE_FEED=$feed" \
            --dart-define="WINDOWS_FEED_PUBLIC_KEY=$FEED_PUBLIC_KEY" \
            --dart-define="UPDATE_URL=${feed}FOXDROP.Merchant.Staging-win-Setup.exe"
          dotnet tool install --global vpk --version 1.2.161
          vpk pack --packId FOXDROP.Merchant.Staging --packVersion "$version" \
            --packDir build/windows/x64/runner/Release --mainExe merchant.exe \
            --packTitle "FOX DROP Merchant (staging)" --skipVeloAppCheck \
            --outputDir "$RUNNER_TEMP/releases"
          # The feed's signature, which the app checks before it updates
          # (a key kept apart from the deploy key; the deploy skill). Without
          # it the installed apps never update themselves.
          if [ -n "$FEED_SIGNING_KEY" ] && [ -n "$FEED_PUBLIC_KEY" ]; then
            printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed.pem"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/feed.pem" \
              -in "$RUNNER_TEMP/releases/releases.win.json" | base64 -w0 \
              > "$RUNNER_TEMP/releases/releases.win.json.sig"
            rm "$RUNNER_TEMP/feed.pem"
          else
            echo "::warning::No feed signing key: the staging PCs will not update themselves"
          fi
          ls -l "$RUNNER_TEMP/releases"
        env:
          # A PEM Ed25519 private key (a secret of the staging environment)
          # and its raw public key in base64 (a variable).
          FEED_SIGNING_KEY: ${{ secrets.STAGING_WINDOWS_FEED_KEY }}
          FEED_PUBLIC_KEY: ${{ vars.STAGING_WINDOWS_FEED_PUBLIC_KEY }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foxdrop-merchant-windows-staging-${{ github.run_number }}
          path: ${{ runner.temp }}/releases
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    needs: [changes, staging-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: publish-windows
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: foxdrop-merchant-windows-staging-${{ github.run_number }}
          path: releases

      - name: Publish to the staging server
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -c -C releases . | ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "foxdrop-deploy@$SSH_HOST" "staging windows"
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
