name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read the pinned Flutter version
        id: flutter
        run: |
          version=$(jq -er .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      # openapi-generator, which generates the Dart client, runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # The generator jar, version pinned in openapitools.json, downloads once.
      - uses: actions/cache@v5
        with:
          path: node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-${{ hashFiles('openapitools.json') }}

      - run: dart pub get --enforce-lockfile

      # The web apps' smoke tests run in Chromium (architecture §18.2).
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @fox-drop/admin exec playwright install --with-deps chromium

      - run: pnpm verify

  # Architecture §4.4: one image runs the four server roles.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: docker build --file apps/server/Dockerfile --tag fox-drop-server:ci .

      - run: node apps/server/scripts/smoke-image.mjs fox-drop-server:ci
