<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--fd-space-lg);
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Money } = FoxDrop;
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render([
    ...section(
      'Sizes',
      h(Money, { key: 1, amount: '45000', symbol: '₺', size: 'secondary' }),
      h(Money, { key: 2, amount: '45000', symbol: '₺' }),
      h(Money, { key: 3, amount: '1050', symbol: '$', size: 'subtitle' }),
      h(Money, { key: 4, amount: '47000', symbol: '₺', size: 'number' }),
    ),
    ...section(
      'Currencies, signs and tones',
      h(Money, { key: 5, amount: '330000000', symbol: 'ل.س' }),
      h(Money, { key: 6, amount: '-2500', symbol: '₺', tone: 'success' }),
      h(Money, { key: 7, amount: '20000', symbol: '₺', signed: true, tone: 'success' }),
      h(Money, { key: 8, amount: '-30000', symbol: '₺', tone: 'danger' }),
    ),
  ]);
</script>
