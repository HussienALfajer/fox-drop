<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--fd-space-md);
    align-items: flex-start;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, ConfirmDialog, Button, AmountsSummary } = FoxDrop;
  const h = React.createElement;
  const app = h(ConfirmDialog, {
    trigger: h(Button, { variant: 'danger', density: 'compact' }, 'إلغاء الطلب'),
    title: 'إلغاء الطلب #10423',
    reasonLabel: 'السبب',
    reasonPlaceholder: 'اكتب سبب الإلغاء',
    reasonError: 'السبب مطلوب',
    effectTitle: 'أثره على الأرصدة',
    effect: h(AmountsSummary, {
      density: 'compact',
      symbol: '₺',
      lines: [
        { label: 'يُعاد للزبون', amount: '47000', tone: 'success' },
        { label: 'يُخصم من المطعم', amount: '-42000', tone: 'danger' },
        { label: 'عمولة المنصة', amount: '-5000', tone: 'danger' },
      ],
      total: { label: 'صافي الأثر', amount: '0' },
    }),
    notifyTitle: 'سيُبلَّغ',
    notified: ['الزبون', 'المطعم', 'الكابتن'],
    confirmLabel: 'تأكيد الإلغاء',
    cancelLabel: 'تراجع',
    closeLabel: 'إغلاق',
    onConfirm: () => undefined,
  });
  ReactDOM.createRoot(document.getElementById('root')).render(app);
  // The card shows the overlay itself: it opens once the page has laid out.
  setTimeout(() => document.querySelector('#root button')?.click(), 150);
</script>
