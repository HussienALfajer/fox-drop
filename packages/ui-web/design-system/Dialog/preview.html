<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--fd-space-md);
    align-items: flex-start;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Dialog, Button } = FoxDrop;
  const h = React.createElement;
  const app = h(Dialog, {
    trigger: h(Button, { variant: 'secondary' }, 'حذف العنوان'),
    title: 'حذف هذا العنوان؟',
    description: '«البيت» يُحذف من عناوينك. طلباتك السابقة لا تتغيّر.',
    confirmLabel: 'حذف',
    cancelLabel: 'إلغاء',
    closeLabel: 'إغلاق',
    tone: 'danger',
  });
  ReactDOM.createRoot(document.getElementById('root')).render(app);
  // The card shows the overlay itself: it opens once the page has laid out.
  setTimeout(() => document.querySelector('#root button')?.click(), 150);
</script>
