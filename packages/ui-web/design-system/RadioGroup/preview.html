<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, RadioGroup } = FoxDrop;
  const options = [
    { value: 'cash', label: 'نقداً عند الاستلام' },
    { value: 'wallet', label: 'المحفظة' },
  ];
  const base = { label: 'طريقة الدفع', options };
  const sections = (section, h) => [
    ...section(
      'Default and selected',
      h(RadioGroup, base),
      h(RadioGroup, { ...base, defaultValue: 'cash' }),
    ),
    ...section(
      'Invalid and disabled',
      h(RadioGroup, { ...base, error: 'اختر طريقة الدفع' }),
      h(RadioGroup, { ...base, disabled: true, defaultValue: 'cash' }),
    ),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
