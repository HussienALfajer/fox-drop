<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, DishCard, Money } = FoxDrop;
  const h = React.createElement;
  const price = (amount) => h(Money, { amount, symbol: '₺', bold: true });
  const base = {
    name: 'وجبة كريسبي',
    description: 'قطعتان مع بطاطس ومشروب',
    price: price('12000'),
    addLabel: 'أضف وجبة كريسبي',
    onAdd: () => undefined,
    href: '#',
  };
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render([
    ...section(
      'To add, from a price, in the cart',
      h(DishCard, base),
      h(DishCard, { ...base, fromLabel: 'من', count: 2 }),
    ),
    ...section(
      'Unavailable',
      h(DishCard, {
        ...base,
        name: 'فطور شامي',
        description: undefined,
        price: price('9000'),
        unavailableLabel: 'يتوفر غداً',
      }),
    ),
  ]);
</script>
