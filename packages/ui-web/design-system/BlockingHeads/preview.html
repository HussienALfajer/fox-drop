<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: 0 0 var(--fd-space-sm);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-xl);
  }
  .cell {
    width: 260px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, BlockingHeads } = FoxDrop;
  const h = React.createElement;
  const cell = (title, item) =>
    h('div', { className: 'cell', key: title }, h('h2', null, title), item);
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' }, [
      cell(
        'VersionTicket (forced update)',
        h(BlockingHeads.VersionTicket, {
          installedLabel: 'إصدارك',
          installed: '1.0.3',
          requiredLabel: 'الإصدار الجديد',
          required: '1.1.0',
          label: 'إصدارك 1.0.3، والمطلوب 1.1.0 أو أحدث',
        }),
      ),
      cell(
        'ShopSign (maintenance)',
        h(BlockingHeads.ShopSign, {
          title: 'نعود قريباً',
          subtitle: 'صيانة قصيرة',
          returnTime: 'نعود الساعة 3:00 م',
          label: 'لافتة: نعود قريباً، الساعة 3:00 م',
        }),
      ),
    ]),
  );
</script>
