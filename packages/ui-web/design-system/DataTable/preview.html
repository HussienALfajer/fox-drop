<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, DataTable, Money, StatusChip } = FoxDrop;
  const h = React.createElement;
  const orders = [
    {
      id: '10423',
      restaurant: 'برجر كبصو',
      status: 'placed',
      label: 'بانتظار المطعم',
      total: '47000',
    },
    {
      id: '10422',
      restaurant: 'شاورما الشام',
      status: 'accepted',
      label: 'قيد التحضير',
      total: '23500',
    },
    {
      id: '10421',
      restaurant: 'كنافة أعزاز',
      status: 'picked_up',
      label: 'مع الكابتن',
      total: '112000',
    },
  ];
  const columns = [
    { key: 'id', header: 'الطلب', cell: (o) => '#' + o.id, sortable: true },
    { key: 'restaurant', header: 'المطعم', cell: (o) => o.restaurant },
    {
      key: 'status',
      header: 'الحالة',
      cell: (o) => h(StatusChip, { status: o.status, label: o.label, density: 'compact' }),
    },
    {
      key: 'total',
      header: 'المجموع',
      numeric: true,
      cell: (o) => h(Money, { amount: o.total, symbol: '₺', size: 'compact' }),
    },
  ];
  function Table() {
    const [sort, setSort] = React.useState({ key: 'id', direction: 'descending' });
    const [selection, setSelection] = React.useState(new Set(['10421']));
    return h(DataTable, {
      label: 'الطلبات',
      columns,
      rows: orders,
      rowKey: (o) => o.id,
      sort,
      onSortChange: setSort,
      selection,
      onSelectionChange: setSelection,
      rowLabel: (o) => 'اختيار الطلب #' + o.id,
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Table));
</script>
