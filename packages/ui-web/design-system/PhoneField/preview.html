<!-- @dsCard group="Forms" height=520 -->
<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, PhoneField } = FoxDrop;
  const base = {
    label: 'رقم الهاتف',
    chipLabel: (name, code) => 'الدولة: ' + name + '، ' + code + '. اضغط لتغييرها',
    searchLabel: 'ابحث باسم الدولة أو رمزها',
    pinnedLabel: 'الأكثر استعمالاً',
    lastUsedLabel: 'آخر ما استعملته',
    allLabel: 'كل الدول',
    emptyLabel: 'لا دولة بهذا الاسم أو الرمز',
    validLabel: 'الرقم صحيح',
    clearLabel: 'مسح الرقم',
    placeholder: '9xx xxx xxx',
    messages: {
      empty: 'أدخل رقم هاتفك.',
      missingDigits: (n) =>
        n === 1 ? 'ينقص رقم واحد.' : n === 2 ? 'ينقص رقمان.' : 'ينقص ' + n + ' أرقام.',
      tooLong: 'الرقم أطول من المعتاد. تأكّد منه.',
      landline: 'هذا رقم أرضي. أدخل رقم جوال عليه واتساب.',
      notMobilePrefix: (prefix) => 'أدخل رقم جوال يبدأ بـ ' + prefix + '.',
      unknownCode: 'رمز الدولة غير معروف.',
      switched: (name) => 'عرفنا الدولة من رمزها: ' + name + '.',
    },
  };
  const sections = (section, h) => [
    ...section(
      'Default and valid',
      h(PhoneField, { ...base, hint: 'سنرسل الرمز إلى واتساب' }),
      h(PhoneField, { ...base, defaultValue: '+963944123456' }),
    ),
    ...section(
      'Another country and an error',
      h(PhoneField, { ...base, defaultValue: '+4915123456789' }),
      h(PhoneField, {
        ...base,
        defaultValue: '+963944123456',
        error: 'هذا الرقم غير مسجّل على واتساب',
      }),
    ),
    ...section(
      'Busy and disabled',
      h(PhoneField, { ...base, busy: true, defaultValue: '+963944123456' }),
      h(PhoneField, { ...base, disabled: true }),
    ),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
