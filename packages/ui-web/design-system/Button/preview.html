<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--fd-space-sm);
    margin-block-end: var(--fd-space-sm);
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Button } = FoxDrop;
  const h = React.createElement;
  const variants = [
    ['primary', 'تأكيد الطلب'],
    ['secondary', 'إضافة عنوان'],
    ['danger', 'إلغاء الطلب'],
    ['ghost', 'تخطّي'],
  ];
  const densities = [
    ['comfortable', 'Comfortable, 50 (phones)'],
    ['compact', 'Compact, 40 (panel and portal only)'],
  ];
  const sections = [];
  for (const [density, title] of densities) {
    sections.push(h('h2', { key: density }, title));
    for (const [variant, label] of variants) {
      const base = { variant, density };
      sections.push(
        h(
          'div',
          { className: 'row', key: density + variant },
          h(Button, base, label),
          h(Button, { ...base, disabled: true }, label),
          h(Button, { ...base, loading: true }, label),
          h(Button, { ...base, icon: 'add' }, label),
          h(Button, { ...base, iconEnd: 'back' }, label),
          h(Button, { ...base, icon: 'cart', label: 'السلة' }),
          h(Button, { ...base, icon: 'cart', label: 'السلة', disabled: true }),
          h(Button, { ...base, icon: 'cart', label: 'السلة', loading: true }),
        ),
      );
    }
  }
  ReactDOM.createRoot(document.getElementById('root')).render(sections);
</script>
