<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, TextField } = FoxDrop;
  const sections = (section, h) => [
    ...section('Default and filled', h(TextField, { label: 'الاسم', placeholder: 'اكتب اسمك', hint: 'كما يظهر في الهوية' }), h(TextField, { label: 'الاسم', defaultValue: 'محمد الأحمد' })),
    ...section('Invalid and disabled', h(TextField, { label: 'الاسم', defaultValue: 'محمد', error: 'اكتب الاسم كما في الهوية' }), h(TextField, { label: 'الاسم', disabled: true, placeholder: 'اكتب اسمك' })),
    ...section('Compact, 40 (panel and portal only)', h(TextField, { label: 'اسم المطعم', density: 'compact', placeholder: 'اكتب الاسم' }), h(TextField, { label: 'اسم المطعم', density: 'compact', defaultValue: 'مطعم الشام' })),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
