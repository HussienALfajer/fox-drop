<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, SearchField } = FoxDrop;
  const base = { label: 'ابحث عن مطعم', clearLabel: 'مسح', placeholder: 'ابحث عن مطعم أو وجبة' };
  const sections = (section, h) => [
    ...section(
      'Default and filled',
      h(SearchField, base),
      h(SearchField, { ...base, defaultValue: 'شاورما' }),
    ),
    ...section(
      'Loading and disabled',
      h(SearchField, { ...base, defaultValue: 'شاورما', loading: true }),
      h(SearchField, { ...base, disabled: true }),
    ),
    ...section(
      'Compact, 40 (panel and portal only)',
      h(SearchField, { ...base, density: 'compact', defaultValue: 'شاورما' }),
    ),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
