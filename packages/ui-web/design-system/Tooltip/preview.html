<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--fd-space-md);
    align-items: flex-start;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Tooltip, Button } = FoxDrop;
  const h = React.createElement;
  const app = h(
    Tooltip,
    { content: 'التنبيهات المفتوحة: 4' },
    h(Button, { variant: 'secondary', density: 'compact' }, 'التنبيهات'),
  );
  ReactDOM.createRoot(document.getElementById('root')).render(app);
  // The card shows it as a pointer resting on the button does.
  setTimeout(() => {
    const target = document.querySelector('#root button');
    for (const type of [
      'pointerover',
      'pointerenter',
      'pointermove',
      'mouseover',
      'mouseenter',
      'mousemove',
    ])
      target?.dispatchEvent(
        new PointerEvent(type, {
          bubbles: type !== 'pointerenter' && type !== 'mouseenter',
          pointerType: 'mouse',
        }),
      );
  }, 150);
</script>
