    min-height: 100vh;

    color: var(--fd-color-on-surface);
  }

  body {

    background: var(--fd-color-surface);

<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, BottomSheet, Button } = FoxDrop;
  const h = React.createElement;
  const content = h('p', null, 'قطعتان مع بطاطس ومشروب');
  const sheet = (props) =>
    h(
      'div',
      null,
      h(BottomSheet, {
        inline: true,
        title: 'وجبة كريسبي',
        closeLabel: 'إغلاق',
        trigger: h(Button, { variant: 'secondary' }, 'افتح'),
        children: content,
        ...props,
      }),
    );
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render([
    ...section('Plain top and the S-curve tab (press «افتح»)', sheet({}), sheet({ sCurve: true })),
  ]);
</script>
