<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--fd-space-md);

</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Drawer, Button } = FoxDrop;
  const h = React.createElement;
  const app = h(
    Drawer,
    {
      trigger: h(Button, { variant: 'secondary', density: 'compact' }, 'عرض الطلب'),
      title: 'الطلب #10421',
      closeLabel: 'إغلاق',
    },
    h('p', { style: { margin: 0, padding: 16 } }, 'كنافة أعزاز · أحمد ع.'),
  );
  ReactDOM.createRoot(document.getElementById('root')).render(app);
  // The card shows the overlay itself: it opens once the page has laid out.
  setTimeout(() => document.querySelector('#root button')?.click(), 150);
</script>
