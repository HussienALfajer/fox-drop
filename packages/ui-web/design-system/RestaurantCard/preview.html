<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    width: 300px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, RestaurantCard, Money } = FoxDrop;
  const h = React.createElement;
  const base = {
    name: 'كنافة أعزاز',
    categories: 'حلويات · مشروبات',
    rating: '4.8',
    eta: '20–30 د',
    fee: h(Money, { amount: '1000', symbol: '₺', size: 'secondary' }),
    href: '#',
    favourite: false,
    favouriteLabel: 'المفضلة',
    onFavourite: () => undefined,
  };
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render([
    ...section(
      'Open, busy and a favourite',
      h(RestaurantCard, base),
      h(RestaurantCard, { ...base, favourite: true, state: { label: 'مشغول', tone: 'warning' } }),
    ),
    ...section(
      'Closed (faded) and new',
      h(RestaurantCard, {
        ...base,
        closed: true,
        state: { label: 'مغلق — يفتح السبت 10:00 ص', tone: 'neutral' },
      }),
      h(RestaurantCard, {
        ...base,
        name: 'برجر كبصو',
        rating: undefined,
        newLabel: 'جديد',
        fee: 'توصيل مجاني',
      }),
    ),
  ]);
</script>
