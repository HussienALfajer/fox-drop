<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Switch } = FoxDrop;
  const sections = (section, h) => [
    ...section(
      'Off and on',
      h(Switch, { label: 'إشعارات الطلبات' }),
      h(Switch, { label: 'إشعارات الطلبات', defaultChecked: true }),
    ),
    ...section(
      'Disabled',
      h(Switch, { label: 'إشعارات الطلبات', disabled: true }),
      h(Switch, { label: 'إشعارات الطلبات', disabled: true, defaultChecked: true }),
    ),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
