<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Checkbox } = FoxDrop;
  const sections = (section, h) => [
    ...section(
      'Unchecked, checked, mixed',
      h(Checkbox, { label: 'أوافق على الشروط' }),
      h(Checkbox, { label: 'أوافق على الشروط', defaultChecked: true }),
      h(Checkbox, { label: 'كل الإضافات', defaultChecked: 'indeterminate' }),
    ),
    ...section(
      'Invalid and disabled',
      h(Checkbox, { label: 'أوافق على الشروط', invalid: true }),
      h(Checkbox, { label: 'أوافق على الشروط', disabled: true }),
      h(Checkbox, { label: 'أوافق على الشروط', disabled: true, defaultChecked: true }),
    ),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
