<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, CodeField } = FoxDrop;
  const base = { label: 'رمز التحقق', hint: 'أرسلنا الرمز إلى واتساب' };
  const sections = (section, h) => [
    ...section('Empty and typing', h(CodeField, base), h(CodeField, { ...base, defaultValue: '482' })),
    ...section('Invalid and done', h(CodeField, { ...base, defaultValue: '482913', error: 'الرمز غير صحيح' }), h(CodeField, { ...base, defaultValue: '482913', done: true })),
    ...section('Disabled', h(CodeField, { ...base, disabled: true })),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
