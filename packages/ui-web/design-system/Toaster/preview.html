<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--fd-space-md);
    align-items: flex-start;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Toaster, useToast, Button } = FoxDrop;
  const h = React.createElement;
  function Show() {
    const toast = useToast();
    return h(
      Button,
      {
        variant: 'secondary',
        onClick: () => toast.show({ tone: 'success', text: 'حُفظت التغييرات' }),
      },
      'أظهر الإشعار',
    );
  }
  const app = h(Toaster, { label: 'الإشعارات', closeLabel: 'إغلاق' }, h(Show));
  ReactDOM.createRoot(document.getElementById('root')).render(app);
</script>
