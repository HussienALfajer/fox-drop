<!-- @dsCard group="Navigation" height=360 -->
<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-sm) 0 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    max-width: 360px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, BottomNavigation } = FoxDrop;
  const h = React.createElement;
  const customer = [
    { icon: 'home', label: 'الرئيسية' },
    { icon: 'search', label: 'البحث' },
    { icon: 'orders', label: 'طلباتي', count: 1, countLabel: '1 جديد' },
    { icon: 'account', label: 'حسابي' },
  ];
  const captain = [
    { icon: 'home', label: 'الرئيسية' },
    { icon: 'wallet', label: 'أرباحي' },
    { icon: 'cash', label: 'عهدتي', dot: true, countLabel: 'جديد' },
    { icon: 'more', label: 'المزيد' },
  ];
  function Demo({ items }) {
    const [selected, setSelected] = React.useState(0);
    return h(BottomNavigation, { label: 'التنقل الرئيسي', items, selected, onSelect: setSelected });
  }
  const section = (title, item) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, item),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render([
    ...section('Customer, with a count', h(Demo, { items: customer })),
    ...section('Captain, with a dot', h(Demo, { items: captain })),
  ]);
</script>
