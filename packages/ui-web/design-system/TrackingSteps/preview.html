<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, TrackingSteps } = FoxDrop;
  const h = React.createElement;
  const steps = [
    { icon: 'receipt', label: 'استلام' },
    { icon: 'restaurant', label: 'تحضير' },
    { icon: 'motorcycle', label: 'في الطريق' },
    { icon: 'house', label: 'وصل' },
  ];
  const strip = (current) =>
    h(TrackingSteps, {
      key: current,
      label: 'حالة الطلب',
      steps,
      current,
      doneLabel: 'تم',
      nowLabel: 'الآن',
    });
  ReactDOM.createRoot(document.getElementById('root')).render([strip(0), strip(2), strip(4)]);
</script>
