<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    max-width: 480px;
    margin-block-end: var(--fd-space-sm);
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, RestaurantBar, StatusChip } = FoxDrop;
  const h = React.createElement;
  const base = {
    name: 'برجر كبصو',
    status: h(StatusChip, { tone: 'success', label: 'مفتوح' }),
    supportLabel: 'الدعم',
    onSupport: () => undefined,
  };
  const section = (title, item) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, item),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render([
    ...section(
      'Connected',
      h(RestaurantBar, { ...base, connected: true, connectionLabel: 'متصل' }),
    ),
    ...section(
      'Offline',
      h(RestaurantBar, { ...base, connected: false, connectionLabel: 'غير متصل' }),
    ),
  ]);
</script>
