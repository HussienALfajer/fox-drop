<style>
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: var(--fd-space-lg) 0 var(--fd-space-xs);
    font-size: 14px;
    font-weight: 700;
    color: var(--fd-color-on-surface);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--fd-space-lg);
    margin-block-end: var(--fd-space-sm);
  }
  .row > * {
    min-width: 260px;
    max-width: 320px;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Select } = FoxDrop;
  const items = [{ value: 'male', label: 'ذكر' }, { value: 'female', label: 'أنثى' }];
  const base = { label: 'الجنس', placeholder: 'اختر', items };
  const sections = (section, h) => [
    ...section('Default and filled', h(Select, { ...base, hint: 'يظهر في ملفك الشخصي' }), h(Select, { ...base, defaultValue: 'female' })),
    ...section('Invalid and disabled', h(Select, { ...base, error: 'اختر الجنس' }), h(Select, { ...base, disabled: true })),
    ...section('Compact, 40 (panel and portal only)', h(Select, { ...base, density: 'compact', defaultValue: 'male' })),
  ];
  const h = React.createElement;
  const section = (title, ...items) => [
    h('h2', { key: title }, title),
    h('div', { className: 'row', key: title + 'row' }, ...items),
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(sections(section, h));
</script>
