<!-- @dsCard group="Icons" height=1000 -->
<style>
  /* The card paints the apps' own ground and text, whatever the page around it. */
  :root {
    color-scheme: light;
  }
  #root {
    min-height: 100vh;
    box-sizing: border-box;
    background: var(--fd-color-surface);
    color: var(--fd-color-on-surface);
  }
  html,
  body {
    margin: 0;
    background: var(--fd-color-surface);
    font-family: var(--fd-font-family-sans);
    color: var(--fd-color-on-surface);
  }
  #root {
    padding: var(--fd-space-lg);
  }
  h2 {
    margin: 0 0 var(--fd-space-sm);
    font-size: 14px;
    font-weight: 700;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: var(--fd-space-md);
    margin-block-end: var(--fd-space-lg);
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--fd-space-xs);
    font-size: 11px;
    direction: ltr;
  }
  .sizes {
    display: flex;
    align-items: center;
    gap: var(--fd-space-lg);
  }
  .styles {
    display: flex;
    flex-direction: column;
    gap: var(--fd-space-md);
  }
  .style-row {
    display: flex;
    align-items: center;
    gap: var(--fd-space-lg);
  }
  .style-name {
    inline-size: 96px;
    font-size: 11px;
    direction: ltr;
  }
</style>
<div id="root" dir="rtl" lang="ar"></div>
<script>
  const { React, ReactDOM, Icon } = FoxDrop;
  const h = React.createElement;
  const names = __ICON_NAMES__;
  const cells = names.map((name) =>
    h('div', { className: 'cell', key: name }, h(Icon, { name, size: 'md' }), name),
  );
  const sizes = ['sm', 'md', 'lg'].map((size) =>
    h('div', { className: 'cell', key: size }, h(Icon, { name: 'home', size }), size),
  );
  // One row per style: its name, then the same five icons.
  const styles = ['linear', 'duotone', 'brand-duo', 'broken', 'bold', 'bold-duo'].map((variant) =>
    h(
      'div',
      { className: 'style-row', key: variant },
      h('span', { className: 'style-name' }, variant),
      ['home', 'bell', 'wallet', 'car', 'offline'].map((name) =>
        h(Icon, { name, size: 'lg', variant, key: name }),
      ),
    ),
  );
  ReactDOM.createRoot(document.getElementById('root')).render([
    h('h2', { key: 'a' }, 'Every icon, md'),
    h('div', { className: 'grid', key: 'b' }, cells),
    h('h2', { key: 'c' }, 'Sizes'),
    h('div', { className: 'sizes', key: 'd' }, sizes),
    h('h2', { key: 'e' }, 'The six styles'),
    h('div', { className: 'styles', key: 'f' }, styles),
  ]);
</script>
