# lib/ is generated by openapi-generator (scripts/generate-api.mjs). Its
# templates break these style rules, which are switched off for this package
# only; errors and every other warning still fail `dart analyze`, so a client
# that no longer compiles against its document fails the check.
include: ../../analysis_options.yaml

analyzer:
  errors:
    # Enum values such as the role codes OWN and FIN keep their spelling.
    constant_identifier_names: ignore
    no_leading_underscores_for_local_identifiers: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_this: ignore
    unused_import: ignore
    use_function_type_syntax_for_parameters: ignore
    # An optional header, such as X-Firebase-AppCheck, is an `if` element.
    use_null_aware_elements: ignore
    use_super_parameters: ignore
