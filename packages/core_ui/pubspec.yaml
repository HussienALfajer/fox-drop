name: core_ui
description: The FOX DROP Flutter components on the design tokens (architecture §9.7).
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  core_tokens: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  material_ui: 1.11.1

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # The ₺ that CoFo lacks (D.9): cut from Noto Sans, SIL OFL (OFL.txt beside it).
  fonts:
    - family: Fox Lira
      fonts:
        - asset: assets/fonts/fox-lira/FoxLira-Regular.ttf
          weight: 400
        - asset: assets/fonts/fox-lira/FoxLira-Medium.ttf
          weight: 500
        - asset: assets/fonts/fox-lira/FoxLira-Bold.ttf
          weight: 700
