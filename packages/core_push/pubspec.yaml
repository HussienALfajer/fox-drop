name: core_push
description: Push notifications of the FOX DROP Flutter apps (architecture §8.1, §11.2).
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  firebase_app_installations: 0.5.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  # 13.x needs permission_handler_android 14.1, which compiles against API 37;
  # the apps compile against 36 on AGP 9.1 (android-release), so 12.x.
  permission_handler: 12.0.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
