name: core_alerts
description: The native ringing layer of the restaurant app (architecture §11.2, §12.2).
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Windows only (architecture §12.3, slice 2.44): none has an Android part.
  flutter_local_notifications_windows: 4.0.1
  tray_manager: 0.5.3
  window_manager: 0.5.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Windows plays the ring sounds from the app's assets (slice 2.44): the
  # Android raw resources themselves, so there is one copy of each, and the
  # tray's icon.
  assets:
    - android/src/main/res/raw/fd_new_order.wav
    - android/src/main/res/raw/fd_pickup_request.wav
    - android/src/main/res/raw/fd_cancellation.wav
    - android/src/main/res/raw/fd_chime.wav
    - assets/tray.ico
  plugin:
    platforms:
      android:
        package: com.foxdrop.core_alerts
        pluginClass: CoreAlertsPlugin
      windows:
        pluginClass: CoreAlertsPluginCApi
