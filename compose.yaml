# The local development services (architecture §17.1). Copy .env.example to
# .env first; every value there is fake and only for this machine.
#   docker compose up --detach
# OSRM starts only with its profile (below). After the first start, set up the
# object storage (its layout, keys and bucket; safe to run again):
#   pnpm --filter @fox-drop/server storage:setup
name: fox-drop

# The OSRM image, the same as infra/osrm/compose.yaml's (infra.test.mjs).
x-osrm: &osrm
  image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
  profiles: [osrm]
  volumes:
    - osrm-data:/data:ro

services:
  postgres:
    # 18-3.6 moves with patch releases, so the digest pins it.
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    environment:
      POSTGRES_DB: fox_drop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      FOX_DROP_MIGRATOR_PASSWORD: ${FOX_DROP_MIGRATOR_PASSWORD:?copy .env.example to .env}
      FOX_DROP_APP_PASSWORD: ${FOX_DROP_APP_PASSWORD:?copy .env.example to .env}
    volumes:
      # Creates the migration and application roles on the first start of an
      # empty volume, after the image's own PostGIS script.
      - ./apps/server/db/init-container.sh:/docker-entrypoint-initdb.d/20-fox-drop.sh:ro
      - ./apps/server/db/bootstrap.sql:/fox-drop/bootstrap.sql:ro
      - postgres-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready --username postgres --dbname fox_drop]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: [valkey-server, --requirepass, '${VALKEY_PASSWORD:?copy .env.example to .env}']
    ports:
      - 127.0.0.1:${VALKEY_PORT:-6379}:6379

  # Real time (architecture §6): the channels are infra/centrifugo/config.yaml;
  # the subscription proxies call the API running on this machine on port 3000.
  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    command: [centrifugo, --config, /centrifugo/config.yaml]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:?copy .env.example to .env}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?copy .env.example to .env}
      CENTRIFUGO_PROXIES: >-
        [{"name": "merchant", "endpoint": "http://host.docker.internal:3000/v1/merchant/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?copy .env.example to .env}"}}},
         {"name": "customer", "endpoint": "http://host.docker.internal:3000/v1/customer/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?copy .env.example to .env}"}}},
         {"name": "captain", "endpoint": "http://host.docker.internal:3000/v1/captain/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?copy .env.example to .env}"}}},
         {"name": "admin", "endpoint": "http://host.docker.internal:3000/v1/admin/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?copy .env.example to .env}"}}}]
      # The panel's browsers (architecture §6.1): Vite's development server and
      # its preview, which forward /connection/websocket here.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: http://localhost:5173 http://localhost:4173
    volumes:
      - ./infra/centrifugo/config.yaml:/centrifugo/config.yaml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${CENTRIFUGO_PORT:-8000}:8000

  # The object storage (architecture §5.8, T7): Garage, as on staging
  # (infra/storage/garage.toml). The panel uploads through Vite's
  # /public-media proxy to the S3 API on 3900; the setup command uses the
  # admin API on 3903.
  storage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?copy .env.example to .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?copy .env.example to .env}
    volumes:
      - ./infra/storage/garage.toml:/etc/garage.toml:ro
      - storage-data:/var/lib/garage
    ports:
      - 127.0.0.1:${STORAGE_PORT:-3900}:3900
      - 127.0.0.1:${STORAGE_ADMIN_PORT:-3903}:3903

  # The images (architecture §5.8, CU §4.5): imgproxy reads public-media with
  # the reader key and serves /media/... on 8088, which the panel reaches
  # through Vite's /media proxy and the Android emulator at 10.0.2.2:8088.
  imgproxy:
    image: darthsim/imgproxy:v4.0.24
    env_file: infra/imgproxy/imgproxy.env
    environment:
      IMGPROXY_S3_ENDPOINT: http://storage:3900
      AWS_ACCESS_KEY_ID: ${STORAGE_READER_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_READER_SECRET:?copy .env.example to .env}
    ports:
      - 127.0.0.1:${IMGPROXY_PORT:-8088}:8080

  # OSRM (architecture §7.1): one osrm-routed per vehicle profile over Azaz's
  # region, as on staging. Build the data once (it downloads the 82 MB Syria
  # extract into the osrm-data volume, never into the repository), and again
  # for fresher map data:
  #   docker compose run --rm osrm-build
  # then start it with `docker compose --profile osrm up --detach`. Without
  # it the server measures the straight line × 1.3.
  osrm-cut:
    profiles: [osrm-build]
    build:
      context: infra/osrm
      dockerfile: cut.Dockerfile
    image: fox-drop-osrm-cut
    command: [sh, /osrm/cut.sh]
    volumes:
      - osrm-data:/data
      - ./infra/osrm:/osrm:ro

  osrm-build:
    <<: *osrm
    profiles: [osrm-build]
    depends_on:
      osrm-cut:
        condition: service_completed_successfully
    command: [sh, /osrm/build.sh]
    volumes:
      - osrm-data:/data
      - ./infra/osrm:/osrm:ro

  osrm-car:
    <<: *osrm
    command: [osrm-routed, --algorithm, mld, /data/current/car/region.osrm]
    ports:
      - 127.0.0.1:5001:5000

  osrm-motorbike:
    <<: *osrm
    command: [osrm-routed, --algorithm, mld, /data/current/motorbike/region.osrm]
    ports:
      - 127.0.0.1:5002:5000

  osrm-bicycle:
    <<: *osrm
    command: [osrm-routed, --algorithm, mld, /data/current/bicycle/region.osrm]
    ports:
      - 127.0.0.1:5003:5000

  osrm-walking:
    <<: *osrm
    command: [osrm-routed, --algorithm, mld, /data/current/walking/region.osrm]
    ports:
      - 127.0.0.1:5004:5000

volumes:
  postgres-data:
  storage-data:
  osrm-data:
