name: captain
description: The captain app «تطبيق الكابتن» (Android, iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  core_api: any
  core_auth: any
  core_l10n: any
  core_realtime: any
  core_time: any
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_ringtone_player: 4.0.0+4
  geolocator: 14.0.2
  go_router: 18.1.3
  package_info_plus: 10.2.2
  wakelock_plus: 1.7.0

dev_dependencies:
  core_storage: any
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Android's development flavor for `flutter run` (architecture §11.4).
  default-flavor: development
  uses-material-design: true
