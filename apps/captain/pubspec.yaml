name: captain
description: The captain app «تطبيق الكابتن» (Android, iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  # The offer's ring, the device check's readers (CA §4.4–4.5, slice 2.43).
  core_alerts: any
  core_api: any
  core_auth: any
  core_l10n: any
  core_maps: any
  core_platform: any
  core_push: any
  core_realtime: any
  # The welcome tour's mark on the device (CA §5.5, slice 2.35a).
  core_storage: any
  core_time: any
  dio: 5.11.1
  flutter:
    sdk: flutter
  # CA §4.3, architecture §14.1 (slice 2.43): the location in the background
  # with its persistent queue; a paid Android licence for release builds.
  flutter_background_geolocation: 5.9.2
  flutter_riverpod: 3.4.3
  geolocator: 14.0.2
  go_router: 18.1.3
  # «إبلاغ عن مشكلة» (CA §13, slice 2.24c): the report's photo.
  image_picker: 1.2.4
  package_info_plus: 10.2.2
  # «مشاركة كصورة» (CA §10.7, slice 2.18c): the statement shared as an image.
  share_plus: 13.3.1
  # The call permission of «طوارئ» (CA §4.5 check 8); core_push's version.
  permission_handler: 13.0.2
  wakelock_plus: 1.7.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Android's development flavor for `flutter run` (architecture §11.4).
  default-flavor: development
  uses-material-design: true
