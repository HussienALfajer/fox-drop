name: captain
description: The captain app «تطبيق الكابتن» (Android, iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  core_api: any
  core_auth: any
  core_l10n: any
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.3

dev_dependencies:
  core_storage: any
  dio: 5.11.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Android's development flavor for `flutter run` (architecture §11.4).
  default-flavor: development
  uses-material-design: true
