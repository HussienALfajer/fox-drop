# Proxy settings for every FOX DROP environment, installed as
# /etc/nginx/snippets/foxdrop-proxy.conf by infra/server/provision.sh.
#
# X-Forwarded-For is replaced, never appended: the API trusts exactly one hop
# (architecture §15.5), so the address it records is the one nginx saw. With
# $proxy_add_x_forwarded_for a client could choose its own address.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_read_timeout 60s;
