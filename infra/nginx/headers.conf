# Response headers for every FOX DROP host, installed as
# /etc/nginx/snippets/foxdrop-headers.conf by infra/server/provision.sh.
# Included at the server level; a location that sets its own add_header drops
# these, so none does.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The web apps load only their own files and call only /v1 and Centrifugo's
# WebSocket on their origin (wss is named: older browsers do not count it as
# 'self').
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://$host; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
# Internal tools and an API: kept out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
