# The web image's own nginx: the panel on 8080, the portal on 8081. The
# server's nginx sends /v1 to the API and everything else here (§17.2).

# Hashed build files never change; index.html must be revalidated so a
# deploy takes effect on the next page load.
map $uri $foxdrop_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    root /usr/share/nginx/admin;
    include /etc/nginx/foxdrop-spa.conf;
}

server {
    listen 8081;
    root /usr/share/nginx/merchant-portal;
    include /etc/nginx/foxdrop-spa.conf;
}
