# Shared by both web apps (nginx.conf).
server_tokens off;
add_header Cache-Control $foxdrop_cache always;

# Browser history routing: every unknown path renders index.html, or a reload
# on a deep link would answer 404. Missing build files still answer 404.
location /assets/ {
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
