# One FOX DROP environment on the shared server (architecture §17.2): staging
# now, production later, each its own Compose project, network, database and
# environment file. foxdrop-deploy (server/deploy.sh) runs it with
# environments/<env>.env, the server's /srv/foxdrop-<env>/shared/.env, and
# FOXDROP_RELEASE (the commit), FOXDROP_HOME, FOXDROP_UID and FOXDROP_GID set.
#
# Every published port is on 127.0.0.1: Docker bypasses the host firewall,
# and nginx is the only public gateway (§15.5). infra.test.mjs checks it.
# imgproxy and the object storage join with their first use.

x-server: &server
  image: ghcr.io/hussienalfajer/fox-drop-server:${FOXDROP_RELEASE:?}
  # The environment's system user, which owns its files and its secrets.
  user: ${FOXDROP_UID:?}:${FOXDROP_GID:?}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_started
  networks: [default, osrm]
  mem_limit: 384m

# Real time (architecture §6): the API and the worker publish through
# Centrifugo's HTTP API on this network; only the API signs connection tokens
# and checks the subscription proxy's secret (§15: each process gets the
# secrets it uses).
x-centrifugo-publish: &centrifugo-publish
  CENTRIFUGO_API_URL: http://centrifugo:8000/api
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?}

x-server-environment: &server-environment
  FOX_DROP_ENVIRONMENT: ${FOXDROP_ENV:?}
  # Sentry's release (§16); the image carries it too.
  FOX_DROP_RELEASE: ${FOXDROP_RELEASE:?}
  DATABASE_URL: postgres://fox_drop_app:${FOX_DROP_APP_PASSWORD:?}@postgres:5432/fox_drop
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379
  IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:?}
  ADMIN_PANEL_URL: https://${ADMIN_HOST:?}
  # Empty until the owner sets it: the server then sends nothing (§16).
  SENTRY_DSN: ${SENTRY_DSN:-}
  # The shared OSRM (osrm/compose.yaml, §7.1). While it is down, distances
  # are the straight line × 1.3.
  OSRM_CAR_URL: http://osrm-car:5000
  OSRM_MOTORBIKE_URL: http://osrm-motorbike:5000
  OSRM_BICYCLE_URL: http://osrm-bicycle:5000
  OSRM_WALKING_URL: http://osrm-walking:5000

services:
  postgres:
    # The same image as the development compose.yaml (infra.test.mjs).
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    restart: unless-stopped
    environment:
      POSTGRES_DB: fox_drop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      FOX_DROP_MIGRATOR_PASSWORD: ${FOX_DROP_MIGRATOR_PASSWORD:?}
      FOX_DROP_APP_PASSWORD: ${FOX_DROP_APP_PASSWORD:?}
    volumes:
      # Run on the first start of an empty volume only. The deploy copies them
      # to a fixed path, so a new release does not recreate the container.
      - ${FOXDROP_HOME:?}/shared/db/init-container.sh:/docker-entrypoint-initdb.d/20-fox-drop.sh:ro
      - ${FOXDROP_HOME:?}/shared/db/bootstrap.sql:/fox-drop/bootstrap.sql:ro
      - postgres-data:/var/lib/postgresql
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      # Over TCP: on the first start the init scripts run on a server that
      # listens on its socket only, and the migrations must wait for them.
      test: [CMD-SHELL, pg_isready --host 127.0.0.1 --username postgres --dbname fox_drop]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    # Holds nothing that cannot be rebuilt (E2), so nothing is saved to disk.
    # At the limit writes fail instead of the container being killed.
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?}
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 200mb
    mem_limit: 256m

  # Applies the migrations before a new release starts (§17.3); run by the
  # deploy with `run --rm migrate`, never by `up`.
  migrate:
    <<: *server
    profiles: [migrate]
    restart: 'no'
    command: [node, dist/database/migrate-command.js]
    environment:
      MIGRATION_DATABASE_URL: postgres://fox_drop_migrator:${FOX_DROP_MIGRATOR_PASSWORD:?}@postgres:5432/fox_drop

  api:
    <<: *server
    environment:
      <<: [*server-environment, *centrifugo-publish]
      PROCESS_ROLE: api
      # App Check on the code requests (§8.3.3 item 1).
      FIREBASE_PROJECT_NUMBER: ${FIREBASE_PROJECT_NUMBER:-}
      # The support numbers the apps show (AP §9.13 contact info).
      SUPPORT_PHONE_NUMBER: ${SUPPORT_PHONE_NUMBER:-}
      SUPPORT_WHATSAPP_NUMBER: ${SUPPORT_WHATSAPP_NUMBER:-}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:?}
      CENTRIFUGO_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET:?}
    ports:
      - 127.0.0.1:${API_PORT:?}:3000
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/v1/admin/status').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *server
    environment:
      <<: [*server-environment, *centrifugo-publish]
      PROCESS_ROLE: worker

  dispatcher:
    <<: *server
    environment:
      <<: *server-environment
      PROCESS_ROLE: dispatcher
    mem_limit: 256m

  # The WhatsApp sender of the sign-in codes (architecture §8.3.3): one
  # session per sending number, restored from PostgreSQL. A number is paired
  # with `run --rm otp-sender node dist/modules/identity/otp-sender-pair-command.js`
  # (the deploy skill). The image stays private on ghcr.io: the WhatsApp
  # library depends on GPL-3.0 code (owner decision 2026-11-06).
  otp-sender:
    <<: *server
    environment:
      <<: *server-environment
      PROCESS_ROLE: otp-sender
      # The support WhatsApp number of the fixed reply (§8.3.3 item 9); empty,
      # the reply points to the apps' help.
      SUPPORT_WHATSAPP_NUMBER: ${SUPPORT_WHATSAPP_NUMBER:-}
    mem_limit: 384m

  # Real time (architecture §6.1): the apps' WebSocket behind nginx's
  # /connection/websocket. The channels are centrifugo/config.yaml, as in
  # development; the subscription proxies call the API on this network, and
  # nginx never lets them in from outside. The memory engine keeps the
  # channels' history, so a restart loses it and the apps fetch the full state.
  centrifugo:
    # The same image as the development compose.yaml (infra.test.mjs).
    image: centrifugo/centrifugo:v6.10.2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    command: [centrifugo, --config, /centrifugo/config.yaml]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:?}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?}
      CENTRIFUGO_PROXIES: >-
        [{"name": "merchant", "endpoint": "http://api:3000/v1/merchant/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?}"}}},
         {"name": "customer", "endpoint": "http://api:3000/v1/customer/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?}"}}},
         {"name": "captain", "endpoint": "http://api:3000/v1/captain/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?}"}}},
         {"name": "admin", "endpoint": "http://api:3000/v1/admin/realtime/subscribe",
          "timeout": "3s", "include_connection_meta": true,
          "http": {"static_headers": {"X-Centrifugo-Proxy-Secret": "${CENTRIFUGO_PROXY_SECRET:?}"}}}]
      # The panel's origin is the only browser origin that connects (the
      # portal and the apps' API host have no live screen yet).
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: https://${ADMIN_HOST:?}
    volumes:
      - ./centrifugo/config.yaml:/centrifugo/config.yaml:ro
    ports:
      - 127.0.0.1:${CENTRIFUGO_PORT:?}:8000
    mem_limit: 128m

  # The panel on 8080 and the portal on 8081 (web/nginx.conf).
  web:
    image: ghcr.io/hussienalfajer/fox-drop-web:${FOXDROP_RELEASE:?}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    ports:
      - 127.0.0.1:${ADMIN_PORT:?}:8080
      - 127.0.0.1:${PORTAL_PORT:?}:8081
    mem_limit: 64m

networks:
  # This environment's network to the shared OSRM (osrm/compose.yaml), which
  # joins it as external. The first deploy creates it, so a deploy never
  # waits for OSRM, and each environment has its own, so staging never
  # reaches production's containers (§17.2). Never change this declaration:
  # Compose would refuse the existing network while OSRM is attached to it
  # (infra.test.mjs).
  osrm:
    name: foxdrop-osrm-${FOXDROP_ENV:?}

volumes:
  postgres-data:
